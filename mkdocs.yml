site_name: Стайлгайд REST API
site_description: Правила технической документации Java и Spring Boot
site_url: https://artsobol.github.io/style-guide-project/
repo_url: https://github.com/Artsobol/style-guide-project
repo_name: Artsobol/style-guide-project
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  language: ru
  font: false
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Главная: index.md
  - Лабораторная работа:
      - Ответы и проектирование: lab/report.md
      - Проверка на документах: lab/evaluation.md
      - Сдача и взаимное ревью: lab/delivery.md
  - Руководство по стилю:
      - Область применения: guide/scope.md
      - Язык и термины: guide/language.md
      - Структура документов: guide/structure.md
      - Markdown и оформление: guide/formatting.md
      - REST API и примеры Java: guide/api.md
      - Доступность текста: guide/accessibility.md
      - Проверка и сопровождение: guide/quality.md
  - Примеры:
      - Первый запрос: examples/quickstart.md
      - Создание задачи: examples/create-task.md
  - Источники: references.md
